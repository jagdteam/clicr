[project]
name = "clicr"
version = "0.2.0.dev0"
description = "Chat with a local codebase using retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pathspec>=1.1.1",
    "numpy>=2.5.4",
    "tree-sitter-language-pack>=1.22.1",
    "ollama>=0.6.3",
    "fastembed>=0.9.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.scripts]
clicr = "clicr.cli:app"

[dependency-groups]
dev = [
    "anthropic>=2.1.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clicr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server (opt-in)"]
addopts = '-m "not ollama"'
