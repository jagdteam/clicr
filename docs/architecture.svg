<path d="M695 121.0 H735" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="330" y="205" width="540" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="600.0" y="237.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">SQLite store</text>
<text x="600.0" y="256.0" font-size="12" fill="#475569" text-anchor="middle">chunks, FTS5 keyword index, vectors, symbols + refs (call graph)</text>
<path d="M830.0 152 V205" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="840.0" y="190" font-size="12" fill="#475569">chunks + vectors</text>
