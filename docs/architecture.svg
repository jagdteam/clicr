<text x="370.0" y="137.0" font-size="12" fill="#475569" text-anchor="middle">.gitignore aware</text>
<rect x="505" y="90" width="190" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="118.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Chunker</text>
<text x="600.0" y="137.0" font-size="12" fill="#475569" text-anchor="middle">tree-sitter, by symbol</text>
<rect x="735" y="90" width="190" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="830.0" y="118.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Embedder</text>
<text x="830.0" y="137.0" font-size="12" fill="#475569" text-anchor="middle">Ollama or fastembed</text>
