<text x="1060.0" y="488.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Cited answer</text>
<text x="1060.0" y="507.0" font-size="12" fill="#475569" text-anchor="middle">citation check on every [n]</text>
