<text x="830.0" y="397.0" font-size="12" fill="#475569" text-anchor="middle">reciprocal rank, k = 60</text>
<rect x="965" y="350" width="190" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="1060.0" y="378.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Rerank</text>
