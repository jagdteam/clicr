<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CliCR architecture</title><desc id="d">Indexing lane: files, walker, tree-sitter chunker, embedder, into a shared SQLite store. Asking lane: question, rewrite and HyDE, vector and BM25 search, RRF, rerank, graph expansion, abstain, context packing, chat model, cited answer with citation check.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="45" y="38" font-size="22" font-weight="700" fill="#0f172a">CliCR architecture</text>
<rect x="25" y="55" width="1150" height="115" rx="10" fill="#eef2f7" stroke="#cbd5e1"/>
<text x="45" y="76" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">INDEXING  (clicr index)</text>
<rect x="25" y="310" width="1150" height="250" rx="10" fill="#eef2f7" stroke="#cbd5e1"/>
<text x="45" y="331" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">ASKING  (clicr ask, clicr chat)</text>
