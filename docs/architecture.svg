<text x="370.0" y="378.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Rewrite / HyDE</text>
<text x="370.0" y="397.0" font-size="12" fill="#475569" text-anchor="middle">standalone query, draft snippet</text>
