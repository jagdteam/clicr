<text x="140.0" y="488.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Graph expansion</text>
<text x="140.0" y="507.0" font-size="12" fill="#475569" text-anchor="middle">definitions of called functions</text>
<rect x="275" y="460" width="190" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="370.0" y="488.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Abstain</text>
<text x="370.0" y="507.0" font-size="12" fill="#475569" text-anchor="middle">best score below threshold</text>
<rect x="505" y="460" width="190" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="488.0" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Context packing</text>
<text x="600.0" y="507.0" font-size="12" fill="#475569" text-anchor="middle">dedupe, merge, token budget</text>
